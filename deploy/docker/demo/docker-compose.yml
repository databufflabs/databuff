# DataBuff APM · OTLP demo seeder
# Usage: INGEST_HOST=192.168.1.10 ./start.sh

services:
  ai-apm-demo:
    image: ${APM_DEMO_IMAGE}
    container_name: ai-apm-demo
    hostname: ai-apm-demo
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -Duser.timezone=Asia/Shanghai
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
      SEED_PROTOCOL: ${SEED_PROTOCOL:-otlp}
      SKYWALKING_GRPC_TARGET: ${SKYWALKING_GRPC_TARGET:-127.0.0.1:11800}
      SEED_INTERVAL_SECONDS: ${SEED_INTERVAL_SECONDS:-30}
      JVM_METRIC_INTERVAL_SECONDS: ${JVM_METRIC_INTERVAL_SECONDS:-60}
      DEMO_FAULT_API_PORT: ${DEMO_FAULT_API_PORT:-18080}
      DEMO_CHANGE_KAFKA_BOOTSTRAP_SERVERS: ${DEMO_CHANGE_KAFKA_BOOTSTRAP_SERVERS:-}
      DEMO_CHANGE_KAFKA_TOPIC: ${DEMO_CHANGE_KAFKA_TOPIC:-buffops.demo.alerts}
    ports:
      - "${DEMO_FAULT_API_HOST_PORT:-18081}:${DEMO_FAULT_API_PORT:-18080}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${DEMO_FAULT_API_PORT}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
